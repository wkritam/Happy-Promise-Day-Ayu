<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Promise Day</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #000000, #1a001a);
    overflow: hidden;
    color: white;
}

/* Floating Hearts */
.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4da6;
    transform: rotate(45deg);
    animation: float 8s linear infinite;
    opacity: 0.7;
}
.heart::before,
.heart::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4da6;
    border-radius: 50%;
}
.heart::before { top: -10px; left: 0; }
.heart::after { left: -10px; top: 0; }

@keyframes float {
    0% { transform: translateY(100vh) rotate(45deg); }
    100% { transform: translateY(-10vh) rotate(45deg); }
}

/* Slides */
.slide {
    position: absolute;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 1s ease;
}

.slide.active {
    opacity: 1;
}

/* Envelope */
.envelope {
    width: 200px;
    height: 130px;
    background: #ff4da6;
    position: relative;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 20px #ff4da6;
}

.envelope::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-bottom: 65px solid #ff66b3;
}

.envelope-text {
    position: absolute;
    bottom: 10px;
    width: 100%;
    font-size: 14px;
    color: white;
    font-weight: bold;
}

/* Promise Text */
.promise-text {
    font-size: 28px;
    color: #ffffff;
    max-width: 700px;
    animation: fadeInUp 1s ease;
}

@keyframes fadeInUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* Closing Envelope */
.closed-envelope {
    width: 200px;
    height: 130px;
    background: #ff4da6;
    border-radius: 8px;
    box-shadow: 0 0 20px #ff4da6;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
}
</style>
</head>

<body>

<!-- Floating Hearts -->
<script>
for(let i=0;i<25;i++){
    let heart = document.createElement('div');
    heart.className='heart';
    heart.style.left=Math.random()*100+'vw';
    heart.style.animationDuration=5+Math.random()*5+'s';
    document.body.appendChild(heart);
}
</script>

<!-- Slides -->
<div class="slide active" id="slide0">
    <div class="envelope" onclick="nextSlide()">
        <div class="envelope-text">Touch to Open</div>
    </div>
</div>

<div class="slide" id="slide1">
    <div class="promise-text">I Promise to always be the icecream to your brownie 🍨🤍</div>
</div>

<div class="slide" id="slide2">
    <div class="promise-text">I Promise to always love you the most I can 💗</div>
</div>

<div class="slide" id="slide3">
    <div class="promise-text">I Promise to always be there when you need a listener 🎧</div>
</div>

<div class="slide" id="slide4">
    <div class="promise-text">I Promise even after our ups and downs we will always make up 💞</div>
</div>

<div class="slide" id="slide5">
    <div class="promise-text">I promise to always be yours and yours only cutu 💖</div>
</div>

<div class="slide" id="slide6">
    <div class="closed-envelope">I Love You ❤️</div>
</div>

<script>
let current = 0;
let totalSlides = 7;

function nextSlide(){
    document.getElementById('slide'+current).classList.remove('active');
    current++;
    if(current < totalSlides){
        document.getElementById('slide'+current).classList.add('active');
    }
}

// Auto next for promise slides
for(let i=1;i<6;i++){
    document.getElementById('slide'+i).addEventListener('click', nextSlide);
}
</script>

</body>
</html>
